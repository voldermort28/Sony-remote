name: Build TrollStore IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SonyRemote.ipa
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Select Xcode
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting $XCODE_PATH..."
            sudo xcode-select -s "$XCODE_PATH"
          fi
          xcodebuild -version

      - name: Install dependencies
        run: npm install

      - name: Generate iOS Native Project
        run: |
          EXPO_NO_TELEMETRY=1 npx expo prebuild --platform ios --no-install
          ls -la ios

      - name: Install CocoaPods
        id: cocoapods
        run: |
          cd ios
          pod install --repo-update 2>&1 | tee ../pod_install.log
          cd ..

      - name: Upload Debug Log if Pod Install Fails
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b build-logs
          git add -f pod_install.log 2>/dev/null || true
          git commit -m "chore: save pod_install.log for debugging" || true
          git push -f origin build-logs || true

      - name: Build iOS Release (Unsigned for TrollStore)
        run: |
          mkdir -p build dist
          
          echo "Building SonyBraviaRemote.xcworkspace with xcodebuild..."
          xcodebuild -workspace ios/SonyBraviaRemote.xcworkspace \
                     -scheme SonyBraviaRemote \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     DEVELOPMENT_TEAM="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app found in build output!"
            find build -name "*.app"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -q -r dist/SonyRemote.ipa Payload
          rm -rf Payload
          echo "IPA created successfully at dist/SonyRemote.ipa"
          ls -lh dist/SonyRemote.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonyRemote-TrollStore-IPA
          path: dist/SonyRemote.ipa
          retention-days: 14

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Sony Bravia Remote v1.0.${{ github.run_number }} (TrollStore IPA)"
          body: |
            ### 📱 Sony BRAVIA Remote cho iOS (TrollStore)
            - **Tải file `SonyRemote.ipa` bên dưới**, mở bằng **TrollStore** để cài đặt trực tiếp.
            - Tối ưu cho TV Sony BRAVIA KD-49X7500H.
            - Hỗ trợ Trackpad cảm ứng, Quick App Launcher, Đồng bộ Clipboard và Phím cứng âm lượng.
          files: dist/SonyRemote.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
