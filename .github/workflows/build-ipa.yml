name: Build TrollStore IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SonyRemote.ipa
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting $XCODE_PATH..."
            sudo xcode-select -s "$XCODE_PATH"
            echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> $GITHUB_ENV
          fi
          xcodebuild -version

      - name: Install dependencies
        run: |
          npm install
          
          # Patch ExpoModulesJSI for Xcode compatibility and unsigned build
          sed -i.bak 's/swift-tools-version: 6.2/swift-tools-version: 6.0/g' node_modules/expo-modules-jsi/apple/Package.swift || true
          sed -i.bak 's/SWIFT_ENABLE_EXPLICIT_MODULES=NO/SWIFT_ENABLE_EXPLICIT_MODULES=NO CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO/g' node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh || true
          sed -i.bak 's/-quiet//g' node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh || true
          echo "Patched ExpoModulesJSI scripts and package manifest."

      - name: Generate iOS Native Project
        run: |
          EXPO_NO_TELEMETRY=1 npx expo prebuild --platform ios --no-install
          
          # Fix NODE_BINARY for Xcode script phases in CI
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local
          
          # Disable code signing in all Pods targets
          ruby -e "
          file = 'ios/Podfile'
          content = File.read(file)
          patch = %Q{
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                end
              end
          }
          content.gsub!('react_native_post_install(', patch + 'react_native_post_install(')
          File.write(file, content)
          "
          ls -la ios

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Configure Unsigned Build Settings
        run: |
          # Remove conditional iPhone Developer signing requirement
          sed -i.bak 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";/g' ios/SonyBraviaRemote.xcodeproj/project.pbxproj || true
          sed -i.bak 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' ios/SonyBraviaRemote.xcodeproj/project.pbxproj || true
          echo "Updated project.pbxproj signing identities."

      - name: Archive iOS App (Unsigned for TrollStore)
        run: |
          set -o pipefail
          mkdir -p build dist
          
          echo "Archiving SonyBraviaRemote with xcodebuild archive..."
          xcodebuild -workspace ios/SonyBraviaRemote.xcworkspace \
                     -scheme SonyBraviaRemote \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     archive \
                     -archivePath build/SonyRemote.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     "CODE_SIGN_IDENTITY[sdk=iphoneos*]=" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     DEVELOPMENT_TEAM="" 2>&1 | tee xcodebuild.log

      - name: Package IPA
        run: |
          mkdir -p Payload dist
          
          # Locate the .app in xcarchive
          APP_PATH=$(find build/SonyRemote.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Searching in build/Build/Products..."
            APP_PATH=$(find build -name "*.app" | grep -v "Pods" | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: No .app bundle found!"
            find build -name "*.app"
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          
          # Verify Info.plist exists inside the bundle
          if [ ! -f Payload/*.app/Info.plist ]; then
            echo "❌ Error: Info.plist is missing from app bundle!"
            ls -la Payload/
            ls -la Payload/*.app/
            exit 1
          fi
          
          echo "✅ Info.plist verified inside app bundle:"
          ls -la Payload/*.app/Info.plist
          
          # Ad-hoc sign for TrollStore compatibility
          codesign --force --deep --sign - Payload/*.app || true
          
          zip -q -r dist/SonyRemote.ipa Payload
          rm -rf Payload
          echo "IPA created successfully at dist/SonyRemote.ipa"
          ls -lh dist/SonyRemote.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonyRemote-TrollStore-IPA
          path: dist/SonyRemote.ipa
          retention-days: 14

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Sony Bravia Remote v1.0.${{ github.run_number }} (TrollStore IPA)"
          body: |
            ### 📱 Sony BRAVIA Remote cho iOS (TrollStore)
            - **Tải file `SonyRemote.ipa` bên dưới**, mở bằng **TrollStore** để cài đặt trực tiếp.
            - Tối ưu cho TV Sony BRAVIA KD-49X7500H.
            - Hỗ trợ Trackpad cảm ứng, Quick App Launcher, Đồng bộ Clipboard và Phím cứng âm lượng.
          files: dist/SonyRemote.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
