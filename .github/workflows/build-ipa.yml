name: Build TrollStore IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SonyRemote.ipa
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate iOS Native Project
        run: npx expo prebuild --platform ios --clean

      - name: Build iOS Release (Unsigned for TrollStore)
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building scheme $SCHEME from $WORKSPACE..."
          
          mkdir -p build dist
          xcodebuild -workspace "$WORKSPACE" \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -q -r dist/SonyRemote.ipa Payload
          rm -rf Payload
          echo "IPA created successfully."
          ls -lh dist/SonyRemote.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonyRemote-TrollStore-IPA
          path: dist/SonyRemote.ipa
          retention-days: 14

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Sony Bravia Remote v1.0.${{ github.run_number }} (TrollStore IPA)"
          body: |
            ### 📱 Sony BRAVIA Remote cho iOS (TrollStore)
            - **Tải file `SonyRemote.ipa` bên dưới**, mở bằng **TrollStore** để cài đặt trực tiếp.
            - Tối ưu cho TV Sony BRAVIA KD-49X7500H.
            - Hỗ trợ Trackpad cảm ứng, Quick App Launcher, Đồng bộ Clipboard và Phím cứng âm lượng.
          files: dist/SonyRemote.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
